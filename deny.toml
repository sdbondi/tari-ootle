# Supply-chain policy for `cargo deny check`, run by `.github/workflows/audit.yml` on every
# dependency change and nightly.
#
# Schema: cargo-deny 0.20. Values the older schema carried and this one does not — `vulnerability`,
# `notice`, `unlicensed`, `copyleft`, `allow-osi-fsf-free` — are now fixed: a security advisory and
# an unmatched or absent license are errors, and nothing else is inferred from a license's OSI or
# FSF status.

[graph]
# The widest graph: a dependency reachable only under a feature is still a dependency this
# repository ships. `.github/workflows/audit.yml` passes `--all-features` to match.
all-features = true
no-default-features = false
# Every target the workspace ships for. Empty means all of them, which is what a validator binary,
# the wasm guest and the ledger app together amount to.
targets = []

[output]
feature-depth = 1

# NOT part of the pull-request gate. `.github/workflows/audit.yml` runs `bans`, `licenses` and
# `sources` on every dependency change; advisories are reported nightly by `rustsec/audit-check`,
# which opens an issue per finding. The tree carries a backlog of live advisories, and gating on it
# before that backlog is triaged would mean either blocking every pull request or filling `ignore`
# below with entries nobody has assessed — and an unassessed ignore reads exactly like a clean
# check. Moving `advisories` into the gate is what closing the backlog is for.
[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# A yanked crate in the lockfile is a release the registry withdrew. It is rare enough to be worth
# stopping for.
yanked = "deny"
# Unmaintained advisories are reported for the workspace's own dependency tree only. A transitive
# unmaintained crate is a fact about a dependency's choices, not something this repository can act
# on, and reporting it here only trains people to ignore the check.
unmaintained = "workspace"
# Every ignore needs a reason and a way out. An entry with neither is a permanent exception nobody
# will revisit.
ignore = []

[licenses]
# Permissive licenses only. Anything not listed here fails the check — there is no default-allow.
allow = [
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "BlueOak-1.0.0",
    "BSL-1.0",
    "WTFPL",
    "MPL-2.0",
    "Zlib",
    # `libbz2-rs-sys`, reached through the integration tests. BSD-style, permissive.
    "bzip2-1.0.6",
    # `webpki-root-certs`. A data licence over the root store, permissive.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false

[bans]
# Duplicate versions are a warning rather than an error: a large tree always carries some, and the
# ones that matter are called out by the skip list below.
multiple-versions = "warn"
# A `*` version requirement accepts whatever the registry serves next.
wildcards = "deny"
# Except a path dependency, which resolves to a directory in this repository rather than to
# whatever a registry serves. The workspace's own crates are wired up that way.
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
# A crate from anywhere other than crates.io is a supply-chain decision, so it has to be written
# down here rather than arrived at through a transitive dependency.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    # The project's own libp2p fork, which the networking stack is built on.
    "https://github.com/tari-project/rust-libp2p.git",
]
